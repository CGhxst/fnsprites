name: Sync sprite dataset

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-sprite-dataset
  cancel-in-progress: false

jobs:
  sync:
    name: Import upstream sprite data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out tracker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install data tooling
        run: npm ci

      - name: Fetch upstream dataset
        run: |
          git remote add upstream https://github.com/staticvacant/fnsprites.git
          git fetch --no-tags upstream main

      - name: Import data and sprite images only
        run: |
          git checkout upstream/main -- sprites-data.js codes-data.js sprites

      - name: Generate application data module
        run: node scripts/build-catalog-module.mjs

      - name: Validate imported dataset
        run: node scripts/validate-catalog.mjs

      - name: Commit changes
        run: |
          git add sprites-data.js codes-data.js sprites src/generated/sprites.js src/generated/codes.js

          if git diff --cached --quiet -- sprites-data.js codes-data.js sprites src/generated/sprites.js src/generated/codes.js; then
            echo "Sprite and code dataset is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: sync upstream sprites and codes"
          git push origin HEAD:main

