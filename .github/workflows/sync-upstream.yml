name: Sync sprite dataset

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-sprite-dataset
  cancel-in-progress: false

jobs:
  sync:
    name: Import upstream sprite data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out tracker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install data tooling
        run: npm ci

      - name: Sync dataset and sprites
        run: npm run sync

      - name: Commit changes
        run: |
          git add sprites src/data/sprites.js src/data/codes.js

          if git diff --cached --quiet -- sprites src/data/sprites.js src/data/codes.js; then
            echo "Sprite and code dataset is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: sync live sprites and codes"
          git push origin HEAD:main

